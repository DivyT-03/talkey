name: Publish to PyPI

# Fires when a GitHub Release is published (not on every push) - tag the
# commit you want to ship (e.g. v0.2.0), then draft a release from that tag.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # Must match the environment name configured in the PyPI project's
    # "Trusted Publisher" settings (see docs/engines.rst / CLAUDE.md) - the
    # environment itself is optional on the GitHub side but recommended,
    # since it lets required-reviewer protection rules gate real releases.
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC) - no API token/secret
      # needed anywhere in this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
