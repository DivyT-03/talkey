name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint (mypy + pylint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install talkey with dev extras
        run: python -m pip install -e ".[dev]"

      - name: mypy
        run: mypy talkey

      - name: pylint
        # --fail-under sets a regression gate around the current baseline
        # rather than demanding a perfect score - most of what's still
        # flagged is pre-existing 2015-era style (see CLAUDE.md) not worth
        # churning for its own sake.
        run: pylint talkey --fail-under=9.0

  linux:
    name: Linux (py${{ matrix.python-version }}, full engine coverage)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install TTS engine binaries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y alsa-utils festival flite espeak file libttspico-utils mbrola-en1

      - name: Install talkey with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run full test suite (mocked + integration)
        run: pytest -q --cov=talkey --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  windows-smoke:
    name: Windows (mocked tests only, no engines installed)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install talkey with dev extras
        run: python -m pip install -e ".[dev]"

      - name: Run mocked-only test suite
        run: pytest -q -m mocked
